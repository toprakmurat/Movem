<a href="{{ url_for('actors.person_detail', person_id=person.id) }}">
  <article class="flex flex-col gap-3 rounded-2xl border border-slate-800 bg-slate-900/60 p-4 shadow-lg transition hover:-translate-y-1 hover:border-brand-400/60">
    <div class="relative">
        {% set placeholder = url_for('static', filename='img/placeholder_avatar.svg') %}
        <img src="{{ url_for('static', filename='img/people/' ~ person.id ~ '.jpg') }}" 
             onerror="this.src='{{ placeholder }}'"
             alt="{{ person.name }} portrait" 
             class="h-56 w-full rounded-xl object-cover" />
    </div>
    <div>
      <h3 class="text-lg font-semibold text-white">{{ person.name }}</h3>
      {% if person.birth_date %}
      <p class="text-sm text-slate-400">Born {{ person.birth_date }}</p>
      {% endif %}
      {% if person.biography %}
      <p class="mt-2 line-clamp-2 text-sm text-slate-300">{{ person.biography }}</p>
      {% endif %}
    </div>
  </article>
</a>
